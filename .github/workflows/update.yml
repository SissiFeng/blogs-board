name: Update reading library
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'scripts/**'
      - 'tests/**'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: blog-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/update.py
      - name: Commit refreshed library
        run: |
          git config user.name 'blog-reader-bot'
          git config user.email 'blog-reader-bot@users.noreply.github.com'
          git add public/data
          if ! git diff --cached --quiet; then
            git commit -m 'Update RSS reading library'
            git push
          fi
